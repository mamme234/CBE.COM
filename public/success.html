<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Successful - CBE Security</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cbe-theme.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="success-container">
        <div class="success-animation">
            <div class="checkmark">✓</div>
        </div>
        
        <div class="success-content">
            <h1>Verification Successful!</h1>
            <p class="success-message">Your identity has been verified successfully.</p>
            <div class="success-details">
                <div class="detail-item">
                    <span class="icon">✅</span>
                    <span>Account Verified</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🔒</span>
                    <span>Secure Connection Established</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🛡️</span>
                    <span>Security Protocol Active</span>
                </div>
            </div>
            <button class="cbe-btn" onclick="window.location.href='/'">Return to Home</button>
        </div>
    </div>

    <script>
        // Send completion signal
        fetch('/api/complete', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
    </script>
</body>
</html>
